<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltear y adivinar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body id="body_voltear">
    <!--Juego de tarjetas en el que te encuentras una palabra y debes
    responder con su resultado. Se dará la vuelta y marcará si aciertas 
    o fallas-->
    <header id="cabecera_voltear">
        <h1>Voltea y adivina</h1>
        <p>Voltea las cartas e intenta adivinar su resultado</p>
    </header>
    <main id="main_voltear">

    </main>
    <script>
        var fallos = 0;
        var aciertos = 0;
        var intentos = 0;
        var numero_palabras = 0;
        const main = document.getElementById("main_voltear");
        async function voltear() {
            try {
                const documento = await fetch('palabras.json', { cache: 'no-store' });
                if (!documento.ok) {
                    throw new Error('No se pudo cargar el archivo');
                }
                const palabras = await documento.json();
                numero_palabras = palabras.length;

                let contenedor = document.createElement("article");
                for (let x = 0; x < palabras.length; x++) {
                    var boton = document.createElement("button");
                    boton.id = "bot" + x;
                    boton.textContent = palabras[x].palabra;
                    boton.addEventListener("click", function () {
                        hacer_intento(x, palabras);
                    });
                    contenedor.appendChild(boton);
                    if ((x + 1) % 5 == 0) {
                        const salto = document.createElement("br");
                        contenedor.appendChild(salto);
                        main.append(contenedor);
                        contenedor = document.createElement("article");
                    }
                }

                if (contenedor.children.length > 0) {
                    main.appendChild(contenedor);
                }

            } catch (err) {
                alert(err);
            }

        }

        function hacer_intento(num, palabras) {
            const numero = num;
            const palabra = palabras[numero].palabra;
            const traduccion = palabras[numero].traduccion;

            const respuesta = prompt("Palabra: " + palabra + ". ¿Cuál es su traducción?");
            if (respuesta === null) return;

            const intento = respuesta.toLowerCase().trim();

            const boton = document.getElementById("bot" + numero);

            if (intento === traduccion.toLowerCase().trim()) {
                boton.className = "acierto";
                aciertos++;
            } else {
                boton.className = "fallo";
                fallos++;
            }
            boton.textContent = traduccion;
            boton.disabled = true;
            intentos++;
            if (intentos >= numero_palabras) {
                main.innerHTML = "";
                alert("Tienes "+ fallos + " fallos y " + aciertos + " aciertos.");
                var reset = confirm("¿Quieres volver a intentarlo?");
                if (reset) {
                    fallos = 0;
                    aciertos = 0;
                    intentos = 0;
                    voltear()
                } else {
                    window.location.href = "index.html";
                }
            }
        }

        voltear();
    </script>
</body>

</html>
