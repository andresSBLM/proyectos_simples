<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasa la carta</title>
    <link rel="stylesheet" href="css/style2.css">
</head>

<body>
    <div id="pantalla">
        <header>
            <h1>Pasa la carta</h1>
            <p>Traduce al español la siguiente palabra</p>
        </header>
        <main id="main">

        </main>
        <section id="palabra_traducida">
            <div id="palabra">

            </div>
            <div id="introducido">

            </div>
            <div id="traduccion">

            </div>
        </section>
        <footer id="pie">
            <div id="aciertos">0</div>
            <div id="errores">0</div>
        </footer>
        <div class="volver"><a href="index.html">Volver</a></div>
    </div>
    <script>
        const MAIN = document.getElementById("main");
        const RESULTADO_PALABRA = document.getElementById("palabra");
        const RESULTADO_INTRODUCIDO = document.getElementById("introducido");
        const RESULTADO_TRADUCCION = document.getElementById("traduccion");
        const PIE = document.getElementById("pie");
        const MOVER_Y = 10;
        const MOVER_X = 10;
        const MOVER_Z_INDEX = 1
        var y = 250;
        var left = 500;
        var id = 1;
        var z;
        var LIMITE;
        var tarjetas = 3;
        var palabras;

        const ACIERTOS = document.getElementById("aciertos");
        const FALLOS = document.getElementById("errores");
        var errores = 0;
        var aciertos = 0;
        var turno = 0;

        var tiempo_inicio;
        var tiempo_fin;

        async function cartas() {

            const documento = await fetch('palabras.json', { cache: 'no-store' });
            if (!documento.ok) {
                alert('No se pudo cargar el archivo');
                return;
            }
            palabras = await documento.json();
            palabras.sort(() => Math.random() - 0.5);
            LIMITE = palabras.length;
            z = LIMITE;
            for (let x = 0; x <= tarjetas - 1; x++) {
                const CARTA = document.createElement("span");
                const P = document.createElement("p");
                CARTA.id = id;
                CARTA.classList.add("carta");
                CARTA.style.top = `${y}px`;
                CARTA.style.left = `${left}px`;
                CARTA.style.zIndex = z;
                CARTA.setAttribute("onclick", "mover_carta()");
                P.textContent = palabras[x].traduccion;
                CARTA.appendChild(P);
                MAIN.appendChild(CARTA);
                y -= MOVER_Y;
                left += MOVER_X;
                z -= MOVER_Z_INDEX;
                id++;
            }
        }


        cartas();

        function mover_carta() {
            if (!tiempo_inicio) {
                tiempo_inicio = new Date();
            }
            const CARTAS = document.getElementsByClassName("carta");
            const carta_de_turno = palabras[turno];
            const INTENTO = prompt(`¿Traducción de ${carta_de_turno.traduccion}?`);
            if (INTENTO) {
                if (INTENTO.toLowerCase() == carta_de_turno.palabra.toLowerCase()) {
                    aciertos++;
                    RESULTADO_INTRODUCIDO.classList.remove("fallo");
                    RESULTADO_INTRODUCIDO.classList.add("acierto");
                } else {
                    errores++;
                    RESULTADO_INTRODUCIDO.classList.add("fallo");
                    RESULTADO_INTRODUCIDO.classList.remove("acierto");
                }
            } else {
                return;
            }
            RESULTADO_PALABRA.textContent = `PALABRA: ${palabras[turno].traduccion}`;
            RESULTADO_INTRODUCIDO.textContent = `INTRODUCIDO: ${INTENTO}`;
            RESULTADO_TRADUCCION.textContent = `TRADUCCIÓN: ${palabras[turno].palabra}`;
            for (let carta of CARTAS) {
                const LEFT_ACTUAL = parseFloat(carta.style.left);
                const TOP_ACTUAL = parseFloat(carta.style.top);
                const INDEX_ACTUAL = parseInt(carta.style.zIndex);
                const ID_ACTUAL = parseInt(carta.id);
                const LEFT_NUEVA = LEFT_ACTUAL - MOVER_X;
                const TOP_NUEVA = TOP_ACTUAL + MOVER_Y;
                const INDEX_NUEVO = INDEX_ACTUAL + 1;
                const ID_NUEVO = ID_ACTUAL - 1;

                carta.style.zIndex = INDEX_NUEVO;
                carta.style.left = `${LEFT_NUEVA}px`;
                carta.style.top = `${TOP_NUEVA}px`;

                carta.id = ID_NUEVO;
            }
            MAIN.firstElementChild.style.top = '1100px';
            MAIN.firstElementChild.style.opacity = 0;

            setTimeout(() => {
                MAIN.firstElementChild.remove();
                FALLOS.textContent = errores;
                ACIERTOS.textContent = aciertos;
                MAIN.style.pointerEvents = "auto";
            }, 1000);
            MAIN.style.pointerEvents = "none";
            turno++;

            if (turno < LIMITE) {
                if (LIMITE > tarjetas) {
                    const NUEVA_CARTA = document.createElement("span");
                    const NUEVO_P = document.createElement("p");
                    NUEVA_CARTA.id = 10;
                    NUEVA_CARTA.classList.add("carta");
                    NUEVA_CARTA.style.top = `-300px`;
                    NUEVA_CARTA.style.left = `${left - MOVER_X}px`;
                    NUEVA_CARTA.style.zIndex = z;
                    NUEVA_CARTA.setAttribute("onclick", "mover_carta()");
                    NUEVO_P.textContent = palabras[tarjetas].traduccion;
                    NUEVA_CARTA.appendChild(NUEVO_P);
                    MAIN.appendChild(NUEVA_CARTA);
                    NUEVA_CARTA.offsetHeight;
                    NUEVA_CARTA.style.top = `${y + MOVER_Y}px`;
                    tarjetas++;
                }
            } else {
                setTimeout(() => {
                    tiempo_fin = new Date();
                    const tiempo_total = tiempo_fin - tiempo_inicio;
                    const tiempo_total_minutos = (tiempo_total / 1000 / 60).toFixed();
                    const tiempo_total_segundos = ((tiempo_total / 1000) % 60).toFixed();
                    alert(`Felicidades acabaste el juego en ${(tiempo_total_minutos)} minuyos y ${(tiempo_total_segundos)} segundos`)
                }, 1000)
                return;
            }

        }



    </script>
</body>

</html>
