<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en raya</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Tres en raya</h1>
    <main id="principal">
        <div id="pantalla"></div>
    </main>
</body>
    <script>
        const PANTALLA = document.getElementById("pantalla");
        var turno = "x";
        var movimientos = [];
        var contador = {x1:0, x2:0, x3:0, y1:0, y2:0, y3:0, a:0, b:0};
        function cargar() {
            for (let x = 1; x <= 3; x++) {
                const FILA = document.createElement("div");
                FILA.id = "fila";
                for (let y = 1; y <= 3; y++) {
                    const CUADRADO = document.createElement("div");
                    CUADRADO.id = "cuadrado";
                    CUADRADO.dataset.ejex = x;
                    CUADRADO.dataset.ejey = y;
                    CUADRADO.addEventListener('click', () => {
                        tocado(CUADRADO);
                    });
                    FILA.appendChild(CUADRADO);
                }
                PANTALLA.appendChild(FILA);
            }
        }
        cargar();

        function tocado(elemento) {
            elemento.style.pointerEvents = "none";
            const EJEX = elemento.dataset.ejex;
            const EJEY = elemento.dataset.ejey;
            if (turno == "x") {
                if (EJEX == 2 && EJEY == 2) {
                    contador.a++;
                    contador.b++;
                }
                else if (EJEX == EJEY) {
                    contador.a++;
                } elseif ((EJEX == 3 && EJEY == 1) || (EJEX == 1 && EJEY == 3)) {
                    contador.a++;
                }
            }
            const AGREGAR = [EJEX, EJEY];
            movimientos.unshift(AGREGAR);
            turno = (turno == "x") ? "o": "x";
            elemento.classList.add(turno);
            if (movimientos.length == 7) {
                for (let elem of contador) {
                    if (elem == 3 || elem == -3) {
                        alert("Has ganado")
                    }
                }
                const ULTIMO = movimientos[movimientos.length - 1];
                const POSX = ULTIMO[0];
                const POSY = ULTIMO[1];
                const BORRAR = document.querySelector(`[data-ejex="${POSX}"][data-ejey="${POSY}"]`);
                BORRAR.style.pointerEvents = "auto";
                BORRAR.classList.remove("x", "o");
                movimientos.pop();
            }
        }


    </script>
</html>
