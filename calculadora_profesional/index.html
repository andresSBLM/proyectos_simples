<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora profesional">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main id="principal">
        <div id="fondo-entrada-salida">
            <input id="salida" name="salida" type="text" readonly>
            <input id="entrada" name="entrada" type="text" readonly>
        </div>
        <article class="contenedor" id="inicio">
            <button class="operacion" onclick="raiz_cuadrada()">√</button>
            <button class="operacion" onclick="log()">log</button>
            <button class="operacion" onclick="numero(Math.PI)">π</button>
            <button class="operacion" onclick="cubo()">x<sup>3</sup></button>

            <button class="operacion" onclick="sin()">sin</button>
            <button class="operacion" onclick="cos()">cos</button>
            <button class="operacion" onclick="tan()">tan</button>
            <button class="operacion" onclick="cuadrado()">x<sup>2</sup></button>

            <button class="borrar" onclick="borrar_todo()">AC</button>
            <button class="op" onclick="numero('%')">%</button>
            <button class="op" onclick="numero('x')">x</button>
            <button  class="borrar" onclick="borrar_ultimo()">DEL</button>
            <button onclick="numero(7)">7</button>
            <button onclick="numero(8)">8</button>
            <button onclick="numero(9)">9</button>
            <button class="op" onclick="numero('-')">-</button>


            <button onclick="numero(4)">4</button>
            <button onclick="numero(5)">5</button>
            <button onclick="numero(6)">6</button>
            <button class="op" onclick="numero('+')">+</button>


            <button onclick="numero(1)">1</button>
            <button onclick="numero(2)">2</button>
            <button onclick="numero(3)">3</button>
            <button id="igual" onclick="evaluar()">=</button>


            <button onclick="numero(0)">0</button>
            <button onclick="numero('.')">.</button>
            <button id="ans" onclick="numero(ultimo_resultado)">ANS</button>

        </article>

    </main>
    <script>
        const salida = document.getElementById("salida");
        const entrada = document.getElementById("entrada");
        var estado = "";
        var ultimo_resultado = "";

        function numero(num) {
            if ((num == "x" || num == "%" || num == "-" || num == "+") && estado == "reciente_resultado") {
                entrada.value = ultimo_resultado;
            } else if (estado == "reciente_resultado") {
                entrada.value = "";
            }
            entrada.value += num;
            estado = "";
        }
        
        function raiz_cuadrada() {
            mostrar_resultado(Math.sqrt(entrada.value));
            entrada.value = '';
            estado = "reciente_resultado";
        }

        function log() {
            mostrar_resultado(Math.log(entrada.value));
            entrada.value = '';
            estado = "reciente_resultado";
        }

        function cubo() {
            mostrar_resultado(entrada.value ** 3);
            entrada.value = '';
            estado = "reciente_resultado";  
        }

        function sin() {
            mostrar_resultado(Math.sin(entrada.value));
            entrada.value = '';
            estado = "reciente_resultado";
        }

        function cos() {
            mostrar_resultado(Math.cos(entrada.value));
            entrada.value = '';
            estado = "reciente_resultado";
        }

        function tan() {
            mostrar_resultado(Math.tan(entrada.value));
            entrada.value = '';
            estado = "reciente_resultado";
        }

        function cuadrado() {
            mostrar_resultado(entrada.value ** 2);
            entrada.value = '';
            estado = "reciente_resultado";  
        }


        function borrar_ultimo() {
            entrada.value = entrada.value.slice(0, -1);
        }

        function borrar_todo() {
            entrada.value = "";
            salida.value = "";
        } 

        function mostrar_resultado(res) {
            if (res) {
                salida.value = res;
                ultimo_resultado = res;
            } else {
                salida.value = "SyntaxError";
            }
        }

        function evaluar() {
            try {
                const expresion = entrada.value.replaceAll("x", "*").replaceAll("%", "/");
                const resultado = eval(expresion);
                salida.value = resultado;
                ultimo_resultado = resultado;
                estado = "reciente_resultado";
            }
            catch (err) {
                salida.value = "SyntaxError";
                entrada.value = "";
            }
        }
    </script>
</body>

</html>
